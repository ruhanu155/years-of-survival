plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { name = 'Curios'; url = 'https://maven.theillusivec4.top/' }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            // Cap the test server so four parallel agents fit in 8 GB (RECONCILE 199).
            jvmArgument '-Xmx1536m'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // data/migrate_fixtures: the GameTest reads the fixture saves from the project (not shipped in the jar).
            systemProperty 'yearofice.fixtures', file('src/test/resources/saves').absolutePath
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }

    // Minecraft's classes on the JUnit classpath, so the migration fixtures decode with the real NBT ops and codecs
    // (data/migrate_fixtures). No server is started by these tests.
    unitTest {
        enable()
        testedMod = mods.getByName(mod_id)
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Gson for the inventory registry check (InventoryTest); the version Minecraft itself ships.
    testImplementation "com.google.code.gson:gson:${gson_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
// unitTest() moves the test working directory under build/; tests read studio/, src/ and docs/ from the project root.
afterEvaluate { tasks.named('test') { workingDir = projectDir } }

apply from: 'tools/debugmap/debugmap.gradle'
apply from: 'tools/content-lint/content-lint.gradle'

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, neo_version_range: neo_version_range,
        loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
        mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description, geckolib_version: geckolib_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
