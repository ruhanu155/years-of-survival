org.gradle.jvmargs=-Xmx1G
# Daemon on but short-lived: a lane's burst of gradle calls reuses one JVM; idle daemons die in 60 s (8 GB box).
org.gradle.daemon=true
org.gradle.daemon.idletimeout=60000
org.gradle.parallel=true
org.gradle.caching=true

# Pinned at M0 (blueprint: Minecraft engine > Version pin). Move only in an upgrade round.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.264
neo_version_range=[21.1.0,)
loader_version_range=[4,)
geckolib_version=4.9.3
curios_version=9.5.1+1.21.1
junit_version=5.11.4
# Test-only, for the inventory check; matches the Gson on Minecraft 1.21.1's classpath.
gson_version=2.10.1

mod_id=yearofice
mod_name=Year of Ice
mod_license=All Rights Reserved
mod_version=0.0.1
mod_group_id=com.yearofice
mod_authors=Ruhan
mod_description=Endless hunter-gatherer survival through Alaskan years. Personal use.
